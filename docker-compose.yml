services:
  db:
    image: postgres:16-alpine
    container_name: platter-postgres
    environment:
      POSTGRES_USER: platter
      POSTGRES_PASSWORD: platter
      POSTGRES_DB: platter
    ports:
      - "5433:5432"
    volumes:
      - platter-pg:/var/lib/postgresql/data
volumes:
  platter-pg:
